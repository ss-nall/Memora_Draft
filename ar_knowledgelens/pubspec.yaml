name: ar_knowledgelens
description: An AI-Powered Context-Aware Augmented Reality Learning Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase Services
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6

  # Networking & AI
  dio: ^5.4.0
  google_generative_ai: ^0.2.2

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Animations & Fonts
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  
  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/animations/
    - assets/icons/
